<svg xmlns="http://www.w3.org/2000/svg" width="460" height="156" viewBox="0 0 460 156" role="img" aria-label="David&#x27;s GitHub activity">
  <style>
    .card { fill: #ffffff; stroke: #d0d7de; }
    .title { fill: #0e75b6; font: 600 17px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .label { fill: #424a53; font: 400 14px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .value { fill: #1f2328; font: 600 14px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; }
      .title { fill: #58a6ff; }
      .label { fill: #9198a1; }
      .value { fill: #f0f6fc; }
    }
  </style>
  <rect class="card" x="0.5" y="0.5" width="459" height="155" rx="6"/>
  <text class="title" x="24" y="34">David&#x27;s GitHub activity</text>
  <text class="label" x="24" y="64">Contributions (last year)</text><text class="value" x="436" y="64" text-anchor="end">1,690</text>
  <text class="label" x="24" y="90">Active days (last year)</text><text class="value" x="436" y="90" text-anchor="end">67</text>
  <text class="label" x="24" y="116">Busiest day</text><text class="value" x="436" y="116" text-anchor="end">129</text>
</svg>
